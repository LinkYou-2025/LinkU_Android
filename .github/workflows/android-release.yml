name: Android Release AAB

# main 브랜치 push 시 자동 실행되며, 필요 시 수동으로도 트리거 가능하다.
# 기존에는 workflow_dispatch로 version_code를 직접 입력받았으나,
# version.properties 파일에서 자동으로 읽어오도록 변경하였다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    env:
      LINKU_SIGNED_AAB_PATH: app/build/outputs/bundle/release/app-release.aab

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # VERSION_CODE, VERSION_NAME 모두 개발자가 version.properties에서 직접 관리한다.
      - name: Read version
        id: version
        run: |
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" ]]; then
            echo "::error::version.properties에서 VERSION_CODE/VERSION_NAME을 읽지 못했습니다."
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate required release configuration
        shell: bash
        env:
          LINKU_KAKAO_NATIVE_APP_KEY: ${{ secrets.LINKU_KAKAO_NATIVE_APP_KEY }}
          LINKU_GOOGLE_WEB_CLIENT_ID: ${{ secrets.LINKU_GOOGLE_WEB_CLIENT_ID }}
          LINKU_SERVER_DOMAIN: ${{ secrets.LINKU_SERVER_DOMAIN }}
          LINKU_SERVER_HOST: ${{ secrets.LINKU_SERVER_HOST }}
          LINKU_API_VERSION: ${{ secrets.LINKU_API_VERSION }}
          LINKU_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.LINKU_GOOGLE_SERVICES_JSON_BASE64 }}
          LINKU_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LINKU_UPLOAD_KEYSTORE_BASE64 }}
          LINKU_UPLOAD_KEYSTORE_TYPE: ${{ secrets.LINKU_UPLOAD_KEYSTORE_TYPE }}
          LINKU_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.LINKU_UPLOAD_KEYSTORE_PASSWORD }}
          LINKU_UPLOAD_KEY_ALIAS: ${{ secrets.LINKU_UPLOAD_KEY_ALIAS }}
          LINKU_UPLOAD_KEY_PASSWORD: ${{ secrets.LINKU_UPLOAD_KEY_PASSWORD }}
        run: |
          required_names=(
            LINKU_KAKAO_NATIVE_APP_KEY
            LINKU_GOOGLE_WEB_CLIENT_ID
            LINKU_SERVER_DOMAIN
            LINKU_SERVER_HOST
            LINKU_API_VERSION
            LINKU_GOOGLE_SERVICES_JSON_BASE64
            LINKU_UPLOAD_KEYSTORE_BASE64
            LINKU_UPLOAD_KEYSTORE_TYPE
            LINKU_UPLOAD_KEYSTORE_PASSWORD
            LINKU_UPLOAD_KEY_ALIAS
            LINKU_UPLOAD_KEY_PASSWORD
          )

          for required_name in "${required_names[@]}"; do
            required_value="${!required_name-}"
            if [[ -z "${required_value//[[:space:]]/}" ]]; then
              echo "::error::Required release configuration $required_name is missing or blank."
              exit 1
            fi
          done

      - name: Restore Google Services configuration
        shell: bash
        env:
          LINKU_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.LINKU_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$LINKU_GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > app/google-services.json

      - name: Restore upload keystore
        shell: bash
        env:
          LINKU_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LINKU_UPLOAD_KEYSTORE_BASE64 }}
          LINKU_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/linku-upload-keystore
        run: |
          umask 077
          printf '%s' "$LINKU_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > "$LINKU_UPLOAD_KEYSTORE_PATH"

      # Gradle이 bundleRelease 실행 중 바로 서명하도록, CI 전용 key.properties를 생성한다.
      # 로컬 개발용 key.properties(gitignore)와 동일한 형식을 CI에서 임시로 재현한다.
      - name: Write release signing configuration
        shell: bash
        env:
          LINKU_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/linku-upload-keystore
          LINKU_UPLOAD_KEYSTORE_TYPE: ${{ secrets.LINKU_UPLOAD_KEYSTORE_TYPE }}
          LINKU_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.LINKU_UPLOAD_KEYSTORE_PASSWORD }}
          LINKU_UPLOAD_KEY_ALIAS: ${{ secrets.LINKU_UPLOAD_KEY_ALIAS }}
          LINKU_UPLOAD_KEY_PASSWORD: ${{ secrets.LINKU_UPLOAD_KEY_PASSWORD }}
        run: |
          umask 077
          {
            echo "storeFile=$LINKU_UPLOAD_KEYSTORE_PATH"
            echo "storeType=$LINKU_UPLOAD_KEYSTORE_TYPE"
            echo "storePassword=$LINKU_UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$LINKU_UPLOAD_KEY_ALIAS"
            echo "keyPassword=$LINKU_UPLOAD_KEY_PASSWORD"
          } > key.properties

      - name: Build release AAB
        shell: bash
        env:
          LINKU_KAKAO_NATIVE_APP_KEY: ${{ secrets.LINKU_KAKAO_NATIVE_APP_KEY }}
          LINKU_GOOGLE_WEB_CLIENT_ID: ${{ secrets.LINKU_GOOGLE_WEB_CLIENT_ID }}
          LINKU_SERVER_DOMAIN: ${{ secrets.LINKU_SERVER_DOMAIN }}
          LINKU_SERVER_HOST: ${{ secrets.LINKU_SERVER_HOST }}
          LINKU_API_VERSION: ${{ secrets.LINKU_API_VERSION }}
        # version_code, version_name 모두 Read version 스텝 출력값을 사용한다.
        # key.properties가 존재하므로 bundleRelease가 서명까지 완료한 AAB를 만든다.
        run: >-
          ./gradlew :app:bundleRelease
          "-PlinkuVersionCode=${{ steps.version.outputs.version_code }}"
          "-PlinkuVersionName=${{ steps.version.outputs.version_name }}"
          --console=plain

      - name: Verify signed release AAB
        shell: bash
        env:
          LINKU_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/linku-upload-keystore
          LINKU_UPLOAD_KEYSTORE_TYPE: ${{ secrets.LINKU_UPLOAD_KEYSTORE_TYPE }}
          LINKU_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.LINKU_UPLOAD_KEYSTORE_PASSWORD }}
          LINKU_UPLOAD_KEY_ALIAS: ${{ secrets.LINKU_UPLOAD_KEY_ALIAS }}
        run: |
          if ! jarsigner -verify -strict \
            -keystore "$LINKU_UPLOAD_KEYSTORE_PATH" \
            -storetype "$LINKU_UPLOAD_KEYSTORE_TYPE" \
            -storepass:env LINKU_UPLOAD_KEYSTORE_PASSWORD \
            "$LINKU_SIGNED_AAB_PATH" \
            "$LINKU_UPLOAD_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Signed release AAB verification failed."
            exit 1
          fi
          echo "Signed release AAB verification passed."

      - name: Remove upload keystore and signing configuration
        if: always()
        shell: bash
        env:
          LINKU_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/linku-upload-keystore
        run: rm -f -- "$LINKU_UPLOAD_KEYSTORE_PATH" key.properties

      # 아티팩트 이름에 version_name을 추가하여 Play Store 제출 시 버전을 쉽게 식별할 수 있도록 한다.
      - name: Upload signed release AAB
        uses: actions/upload-artifact@v7
        with:
          name: linku-signed-release-vc-${{ steps.version.outputs.version_code }}-vn-${{ steps.version.outputs.version_name }}
          path: ${{ env.LINKU_SIGNED_AAB_PATH }}
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: linku-mapping-vc-${{ steps.version.outputs.version_code }}-vn-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
